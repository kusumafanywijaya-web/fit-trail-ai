<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit Trail AI</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
text-align:center;
}

.container{
max-width:500px;
margin:60px auto;
padding:20px;
}

.logo{
font-size:50px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

p{
color:#cbd5e1;
}

.card{
background:#1f2937;
padding:25px;
border-radius:15px;
margin-top:25px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.fb{
background:#1877F2;
color:white;
}

.ai{
background:#22c55e;
color:white;
}

.footer{
margin-top:40px;
font-size:14px;
color:#94a3b8;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🤖</div>

<h1>Fit Trail AI</h1>

<p>Hubungkan Facebook Page Anda dan jalankan AI Agent.</p>

<div class="card">

<button class="fb" onclick="loginFacebook()">
Login dengan Facebook
</button>

<button class="ai" onclick="startAI()">
Mulai AI Agent
</button>

</div>

<div class="footer">
© 2026 Fit Trail AI
</div>

</div>

<script>

<script> async defer crossorigin="anonymous"
src="https://connect.facebook.net/id_ID/sdk.js"></script>

<script>
window.fbAsyncInit = function () {
  FB.init({
    appId: '1403287995183514',
    cookie: true,
    xfbml: true,
    version: 'v23.0'
  });
};

function loginFacebook() {
  FB.login(function(response) {
    if (response.authResponse) {

      FB.api('/me', {fields:'name,email'}, function(user) {
        alert("Selamat datang " + user.name);
        console.log(user);
      });

    } else {
      alert("Login dibatalkan");
    }
  }, {
    scope: 'public_profile,email,pages_show_list'
  });
}

function startAI(){
    alert("AI Agent siap dijalankan.");
}
</script>

function startAI(){
alert("AI Agent siap dijalankan.");
}

</script>

</body>
</html>
